<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FDE Knowledge Assistant</title>
<style>
:root{--bg:#f6f8fb;--fg:#10213a;--card:#fff;--mut:#5b6b82;--acc:#0b6bcb;--bd:#d9e1ec;--ok:#0a7d4f;--bad:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#0e1623;--fg:#e6edf7;--card:#16233a;--mut:#9db0c9;--acc:#58a6ff;--bd:#27374f;--ok:#3fb68b;--bad:#ff7b72}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}main{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
input,select,button{padding:8px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}input{flex:1;min-width:200px}
button{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);font-size:12px;color:var(--mut);margin-right:4px}
.bad{color:var(--bad)}.ok{color:var(--ok)}details{margin-top:6px}summary{cursor:pointer;color:var(--acc)}pre{white-space:pre-wrap;font-size:12px}
</style></head><body><main>
<h1 style="font-size:20px">FDE Knowledge Assistant <span class="pill">hybrid RAG</span><span class="pill">ACL pre-filter</span><span class="pill">cited &amp; verified</span></h1>
<div class="row"><select id="role"></select><select id="prov"><option>mock</option><option>auto</option><option>anthropic</option><option>openai</option><option>gemini</option><option>xai</option></select>
<input id="q" placeholder="Ask about integration standards, SSO, refunds, incident response..." value="What is the retry policy for failed webhooks?"><button id="go">Ask</button></div>
<div id="out"></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('/api/roles').then(r=>r.json()).then(a=>{a.forEach(x=>$('role').add(new Option(x,x)));$('role').value='employee'});
async function go(){const r=await fetch('/api/ask',{method:'POST',body:JSON.stringify({question:$('q').value,role:$('role').value,provider:$('prov').value})});const j=await r.json();
let h='<div class="card">';if(j.error){h+='<span class="bad">'+esc(j.error)+'</span>'}else{
h+=j.refused?`<b class="bad">Refused</b> <span class="pill">${esc(j.reason)}</span><p>${esc(j.answer)}</p>`:`<p>${esc(j.answer)}</p>`+j.sources.map(s=>`<details><summary>[${esc(s.id)}] ${esc(s.title)} &rsaquo; ${esc(s.section)}</summary><pre>${esc(s.text)}</pre></details>`).join('');
h+=`<p><span class="pill">coverage ${j.flags.evidence_coverage??'-'}</span><span class="pill">sanitized ${j.flags.sanitized_sentences_removed??0}</span><span class="pill">${esc(j.provider||'')}</span></p>`}
$('out').innerHTML=h+'</div>'}
$('go').onclick=go;$('q').onkeydown=e=>{if(e.key==='Enter')go()};
</script></main></body></html>
